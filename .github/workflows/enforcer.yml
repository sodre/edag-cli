name: Enforcer
on: [push]
jobs:
  enforcer:
    runs-on: ubuntu-latest
    name: Black & Flake8 & Coverage
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-python@v1.1.1
        with:
          python-version: 3.8
      - uses: actions/cache@v1
        id: cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.8-pip-${{ hashFiles('setup.py') }}
      - run: pip install black flake8 codacy-coverage
      - run: black --check .
      - run: flake8 .
      - run: python setup.py test
      - run: python-codacy-coverage -r coverage.xml
        env:
          CODACY_PROJECT_TOKEN: ${{  secrets.CODACY_PROJECT_TOKEN }}
  serverless-tox:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        python-version: [3.6, 3.7, 3.8]
    runs-on: ${{  matrix.os }}
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-python@v1.1.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip --version
      - name: Get pip cache
        id: pip-cache
        run: |
          python -c "from pip._internal.locations import USER_CACHE_DIR; print('::set-output name=dir::' + USER_CACHE_DIR)"
      - uses: actions/cache@v1
        id: cache
        with:
          path: ${{  steps.pip-cache.outputs.dir }}
          key: ${{  matrix.os }}-${{ matrix.python-version }}-pip-${{ hashFiles('setup.py') }}
      - run: |
          strace python setup.py test
